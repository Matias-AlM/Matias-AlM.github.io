# This file was auto-generated by the Firebase CLI
# https://github.com/firebase/firebase-tools

# Despliega la web al hacer merge a main y, ademas, cada 6 horas, a mano o por
# repository_dispatch "roadmap" para refrescar la hoja de ruta desde los issues
# (scripts/roadmap.py, docs/roadmap.md). Los disparos que no son un push solo
# redespliegan si la hoja de ruta generada difiere de la publicada.
name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [roadmap]
concurrency:
  group: despliegue-web
  cancel-in-progress: false
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Si falla (p. ej. falta ROADMAP_TOKEN) no se toca la pagina, el despliegue sigue con
      # la hoja de ruta versionada y el job acaba en rojo en el ultimo paso.
      - id: roadmap
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ROADMAP_TOKEN: ${{ secrets.ROADMAP_TOKEN }}
        run: python3 scripts/roadmap.py
      - run: ./construir.sh
      - id: cambio
        if: github.event_name != 'push' && steps.roadmap.outcome == 'success'
        run: |
          if curl -fsS -H 'Cache-Control: no-cache' https://getswiftpen.com/roadmap/ -o publicada.html \
             && cmp -s publicada.html dist/roadmap/index.html; then
            echo "La hoja de ruta publicada ya esta al dia."
            echo "cambiado=false" >> "$GITHUB_OUTPUT"
          else
            echo "cambiado=true" >> "$GITHUB_OUTPUT"
          fi
      - if: github.event_name == 'push' || steps.cambio.outputs.cambiado == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SWIFTPEN }}
          channelId: live
          projectId: swiftpen
      - if: steps.roadmap.outcome == 'failure'
        run: |
          echo "::error::scripts/roadmap.py fallo: la hoja de ruta no se ha actualizado (ver el paso anterior y docs/roadmap.md)"
          exit 1
